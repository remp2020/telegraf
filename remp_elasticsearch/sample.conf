# Write REMP events to Elasticsearch (index, upsert or array-union by document ID)
[[outputs.remp_elasticsearch]]
  ## Elasticsearch node URLs. Requests are load-balanced across the nodes and
  ## retried on another node if one is unavailable.
  urls = ["http://localhost:9200"] # required

  ## Timeout of a single request (bulk write or version check).
  # timeout = "5s"

  ## Discover the rest of the cluster from the configured nodes on startup and
  ## then every 15 minutes. Don't enable it when Elasticsearch runs behind a
  ## proxy or in a container network that publishes unreachable addresses.
  # enable_sniffer = false

  ## HTTP basic authentication
  # username = "telegraf"
  # password = "mypassword"

  ## Optional TLS config
  # tls_ca = "/etc/telegraf/ca.pem"
  # tls_cert = "/etc/telegraf/cert.pem"
  # tls_key = "/etc/telegraf/key.pem"
  ## Use TLS but skip chain & host verification
  # insecure_skip_verify = false

  ## Target index. The metric timestamp (UTC) is used for date specifiers:
  ##   %Y - year (2016), %y - year (16), %m - month (01..12), %d - day (01..31),
  ##   %H - hour (00..23), %V - ISO week (1..53)
  ## A tag value can be used with {{tag_name}}; if the metric doesn't have the
  ## tag, default_tag_value is used instead.
  index_name = "pageviews" # required
  # default_tag_value = "none"

  ## Field (after decoding _json) holding the Elasticsearch document ID. It must
  ## be a string. Metrics without it are dropped. When not set, Elasticsearch
  ## generates the ID; such writes are not idempotent and a retried batch can
  ## create duplicates.
  # id_field = "remp_pageview_id"

  ## Upsert mode: the first metric with a given ID creates the document, later
  ## ones overwrite only the listed fields. Requires id_field.
  # updated_fields = ["timespent"]

  ## Array-union mode: values of the listed fields are added to the arrays
  ## stored in the document (duplicates are removed). The first metric with a
  ## given ID creates the document. Requires id_field. Cannot be combined with
  ## updated_fields.
  # added_fields = ["element_ids"]

  ## Keep only these fields in the document. Fields packed in _json can't be
  ## filtered by fieldexclude/taginclude, so filtering is done here. REMP
  ## identifiers (category, action, browser_id, user_id, article_id,
  ## remp_pageview_id, remp_session_id, url, time) are always kept.
  # field_whitelist = ["token", "subscriber", "timespent"]
